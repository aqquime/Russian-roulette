<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Russian-roulette</title>
  <link rel="stylesheet" href="./main.css">
</head>
<body>
  <header>
    <h1>Russian-Roulette</h1>
  </header>
  <main>
      <form id="form">
      <label>Select the number of rounds</label>
      <input type="number" name="bullets" min="1" max="5" value="1" required>
      <button id="submitBtn" type="submit">Start</button>
    </form>
    <button id="pullBtn">Pull</button>
    <button id="againBtn">New Game</button>
    <div id="status"></div>
  </main>
  <script src="script_copy.js"></script>
</body>
</html>
